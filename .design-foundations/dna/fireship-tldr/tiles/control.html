<template shadowrootmode="open">
  <style>
    :host {
      display: block;
      width: 100%;
      height: 100%;
      --bg: oklch(0.19 0.02 280);
      --bg-2: oklch(0.24 0.03 280);
      --accent: oklch(0.62 0.19 290);
      --accent-2: oklch(0.7 0.15 250);
      --text: oklch(0.97 0.005 280);
      --text-dim: oklch(0.72 0.02 280);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-family: var(--font);
    }

    * { box-sizing: border-box; }

    .wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(120% 100% at 15% 0%, oklch(0.3 0.08 290 / 0.55), transparent 60%),
        radial-gradient(100% 90% at 100% 100%, oklch(0.28 0.09 250 / 0.45), transparent 55%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      padding: 7% 8%;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 8px oklch(0.62 0.19 290 / 0.7);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    .navlinks {
      display: flex;
      gap: 10px;
      font-size: 9px;
      color: var(--text-dim);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      align-self: flex-start;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--accent-2);
      background: oklch(0.62 0.19 290 / 0.14);
      border: 1px solid oklch(0.62 0.19 290 / 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .badge::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-2);
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 27px;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.02em;
      max-width: 90%;
      background: linear-gradient(135deg, var(--text) 40%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.deck {
      margin: 0 0 18px 0;
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--text-dim);
      max-width: 85%;
    }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6%;
    }

    .btn-primary {
      font-size: 10.5px;
      font-weight: 700;
      color: oklch(0.15 0.02 280);
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 16px oklch(0.62 0.19 290 / 0.35);
    }

    .btn-secondary {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text);
      background: oklch(1 0 0 / 0.06);
      border: 1px solid oklch(1 0 0 / 0.14);
      padding: 9px 14px;
      border-radius: 8px;
    }

    .stats {
      display: flex;
      gap: 22px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid oklch(1 0 0 / 0.1);
    }

    .stat .num {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }

    .stat .label {
      font-size: 8.5px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }

    .card {
      position: absolute;
      right: 6%;
      top: 22%;
      width: 34%;
      background: oklch(1 0 0 / 0.06);
      border: 1px solid oklch(1 0 0 / 0.12);
      border-radius: 12px;
      padding: 10px;
      backdrop-filter: blur(6px);
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .card .thumb {
      width: 100%;
      height: 44px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      margin-bottom: 8px;
      opacity: 0.85;
    }

    .card .line {
      height: 5px;
      border-radius: 3px;
      background: oklch(1 0 0 / 0.18);
      margin-bottom: 5px;
    }

    .card .line.short { width: 60%; }

    @media (prefers-reduced-motion: reduce) {
      .dot, .card { animation: none; }
    }
  </style>

  <div class="wrap">
    <div class="nav">
      <div class="brand"><span class="dot"></span>TL;DR RECAP</div>
      <div class="navlinks"><span>Episodes</span><span>Archive</span></div>
    </div>

    <span class="badge">New Episode</span>
    <h1>Everything you missed from today's AI model launch</h1>
    <p class="deck">The 22-minute video, distilled into a 90-second read. Benchmarks, pricing, and the one demo everyone's talking about.</p>

    <div class="cta-row">
      <button class="btn-primary">Read the Recap</button>
      <button class="btn-secondary">Watch Video</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="num">4.2M</div><div class="label">Views</div></div>
      <div class="stat"><div class="num">18</div><div class="label">Min Read</div></div>
      <div class="stat"><div class="num">92%</div><div class="label">Liked</div></div>
    </div>

    <div class="card">
      <div class="thumb"></div>
      <div class="line"></div>
      <div class="line short"></div>
    </div>
  </div>
</template>
