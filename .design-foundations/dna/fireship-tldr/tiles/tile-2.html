<template shadowrootmode="open">
  <style>
    :host {
      display: block;
      width: 100%;
      height: 100%;
      --hue: 220;
      --accent: oklch(0.55 0.16 220);
      --accent-soft: oklch(0.68 0.14 220);
      --ground: oklch(0.97 0.014 220);
      --ground-panel: oklch(0.995 0.006 220);
      --ink: oklch(0.24 0.045 250);
      --ink-soft: oklch(0.46 0.03 245);
      --font: "Comic Sans MS", "Chalkboard SE", "Comic Neue", "Marker Felt", sans-serif;
      --font-body: system-ui, "Segoe UI", sans-serif;
      font-family: var(--font);
      background: var(--ground);
      overflow: hidden;
      position: relative;
      box-sizing: border-box;
      color: var(--ink);
    }
    * { box-sizing: border-box; }

    /* faint multicolumn page guides — the ground the display type violates */
    .page {
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        90deg,
        oklch(0.55 0.16 220 / 0.05) 0,
        oklch(0.55 0.16 220 / 0.05) 1px,
        transparent 1px,
        transparent 24.9%
      );
      padding: 9px;
    }

    /* ---------- eyebrow + masthead: oversized display type, crosses the grid ---------- */
    .eyebrow {
      position: absolute;
      top: 8px;
      left: 10px;
      z-index: 6;
      font-family: var(--font-body);
      font-size: 7.5px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--accent);
      background: var(--ground-panel);
      padding: 2px 5px;
      border: 1.5px solid var(--ink);
      transform: rotate(-2deg);
    }

    .masthead {
      position: absolute;
      top: 13px;
      left: 6px;
      z-index: 6;
      width: 62%;
      margin: 0;
      font-family: var(--font);
      font-weight: 700;
      font-size: 37px;
      line-height: 0.82;
      letter-spacing: -0.5px;
      color: var(--ink);
      text-shadow: 2px 2px 0 var(--accent-soft), 4px 4px 0 oklch(0.55 0.16 220 / 0.35);
      transform: rotate(-1.6deg);
      transform-origin: left top;
      animation: wobble 5s ease-in-out infinite;
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-1.6deg) translateY(0); }
      50% { transform: rotate(-0.6deg) translateY(-1px); }
    }

    .deck {
      position: absolute;
      top: 58px;
      right: 8px;
      z-index: 6;
      width: 34%;
      font-family: var(--font-body);
      font-size: 7px;
      line-height: 1.4;
      color: var(--ink-soft);
      column-count: 1;
      background: oklch(1 0 0 / 0.7);
      padding: 3px 4px;
      border-left: 2px solid var(--accent);
    }

    /* ---------- comic panel grid, gutters like a page, hard borders ---------- */
    .panels {
      position: absolute;
      top: 57px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr;
      grid-template-rows: 1.15fr 1fr;
      grid-template-areas:
        "a a b"
        "c d b";
      gap: 6px;
    }
    .panel {
      position: relative;
      border: 3px solid var(--ink);
      background: var(--ground-panel);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 2px 0 oklch(0.24 0.045 250 / 0.18);
    }
    .panel.a { grid-area: a; }
    .panel.b { grid-area: b; }
    .panel.c { grid-area: c; }
    .panel.d { grid-area: d; }

    .art {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(155deg, oklch(0.9 0.03 220), oklch(0.82 0.05 220));
    }
    .art .tag {
      font-family: var(--font-body);
      font-size: 6.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink);
      background: oklch(1 0 0 / 0.75);
      border: 1px solid var(--ink);
      padding: 1.5px 4px;
      z-index: 2;
    }

    /* ---------- detail-move: Ben-Day halftone dot fill, one panel only ---------- */
    .art.dots {
      background:
        radial-gradient(circle, var(--accent) 1.1px, transparent 1.3px) 0 0/7px 7px,
        radial-gradient(circle, var(--accent) 1.1px, transparent 1.3px) 3.5px 3.5px/7px 7px,
        oklch(0.9 0.02 220);
      animation: shimmer 3.4s ease-in-out infinite;
    }
    @keyframes shimmer {
      0%, 100% { background-position: 0 0, 3.5px 3.5px, 0 0; }
      50% { background-position: 1.5px 1px, 5px 4.5px, 0 0; }
    }

    .caption {
      flex: 0 0 auto;
      font-family: var(--font-body);
      font-size: 6.6px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--ground);
      background: var(--ink);
      padding: 3px 5px;
      border-top: 2px solid var(--ink);
    }

    .burst {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-soft);
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      font-family: var(--font-body);
      font-size: 5.5px;
      font-weight: 800;
      color: var(--ink);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.14); }
    }

    .footer {
      position: absolute;
      bottom: 2px;
      right: 10px;
      z-index: 6;
      font-family: var(--font-body);
      font-size: 5.5px;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
    }
  </style>

  <div class="page">
    <div class="eyebrow">FIRESHIP · TL;DR</div>
    <h1 class="masthead">CODE<br>REPORT</h1>
    <p class="deck">Sol ships. Fable stays cool. Grok goes loud. Three reaction gags, one recap, in panels.</p>

    <div class="panels">
      <div class="panel a">
        <div class="art">
          <span class="tag">FRY · SUSPICIOUS</span>
          <div class="burst">NEW</div>
        </div>
        <div class="caption">"wait, GPT-5.6 is just called Sol now?"</div>
      </div>
      <div class="panel b">
        <div class="art dots">
          <span class="tag">ROCKET · BOOM</span>
        </div>
        <div class="caption">Grok 4.5 ships, benchmarks explode on cue.</div>
      </div>
      <div class="panel c">
        <div class="art">
          <span class="tag">ALTMAN · STARBUCKS</span>
        </div>
        <div class="caption">"sol's ready, sam."</div>
      </div>
      <div class="panel d">
        <div class="art">
          <span class="tag">FABLE · CALM</span>
        </div>
        <div class="caption">Claude Fable: unbothered, still winning SWE-bench.</div>
      </div>
    </div>
    <div class="footer">EP. 412 — THE RECAP</div>
  </div>
</template>
