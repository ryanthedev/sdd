<template shadowrootmode="open">
  <style>
    :host {
      display: block;
      width: 100%;
      height: 100%;
      --hue: 35;
      --ground: oklch(0.94 0.025 35);
      --ground-line: oklch(0.88 0.03 35);
      --paper: oklch(0.97 0.012 35);
      --paper-alt: oklch(0.93 0.02 35);
      --ink: oklch(0.27 0.025 35);
      --ink-soft: oklch(0.48 0.02 35);
      --band-dark: oklch(0.24 0.032 35);
      --band-dark-ink: oklch(0.93 0.018 35);
      --accent: oklch(0.55 0.05 35);
      --accent-ink: oklch(0.98 0.008 35);
      --font: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-family: var(--font);
      color: var(--ink);
      overflow: hidden;
      position: relative;
    }

    * { box-sizing: border-box; }

    .tile {
      width: 100%;
      height: 100%;
      background: var(--ground);
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 5% 0;
      position: relative;
      overflow: hidden;
    }

    /* laminate diner-counter texture on the outer ground */
    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        118deg,
        oklch(1 0 0 / 0.06) 0 2px,
        transparent 2px 14px
      );
      pointer-events: none;
    }

    .receipt {
      position: relative;
      width: 54%;
      min-width: 150px;
      max-width: 230px;
      background: var(--paper);
      display: flex;
      flex-direction: column;
      box-shadow: 0 3px 0 var(--ground-line), 0 10px 22px oklch(0.2 0.02 35 / 0.28);
      overflow: hidden;
      font-size: 7.4px;
      line-height: 1.35;
    }

    /* lamination sheen — the detail-move, quiet and small */
    .receipt::after {
      content: "";
      position: absolute;
      inset: -20% -50%;
      background: linear-gradient(
        112deg,
        transparent 42%,
        oklch(1 0 0 / 0.22) 47%,
        oklch(1 0 0 / 0.45) 50%,
        oklch(1 0 0 / 0.22) 53%,
        transparent 58%
      );
      mix-blend-mode: overlay;
      animation: sheen-drift 8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes sheen-drift {
      0%, 100% { transform: translate(-12%, -8%); }
      50% { transform: translate(12%, 8%); }
    }

    .band {
      flex: 0 0 auto;
      position: relative;
      padding: 6% 9%;
      background: var(--paper);
      color: var(--ink);
      opacity: 1;
      transform: translateY(0);
      animation: settle 0.7s ease-out both;
    }

    @keyframes settle {
      0% { opacity: 0.55; transform: translateY(-4%); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* --- band 1: header, dark ground, packed --- */
    .band--head {
      background: var(--band-dark);
      color: var(--band-dark-ink);
      padding: 7% 9% 6%;
      text-align: center;
      animation-delay: 0s;
    }
    .band--head .title {
      font-weight: 700;
      letter-spacing: 0.14em;
      font-size: 1.28em;
    }
    .band--head .sub {
      margin-top: 0.4em;
      font-size: 0.78em;
      letter-spacing: 0.08em;
      opacity: 0.75;
    }

    /* --- band 2: meta, light, breathing --- */
    .band--meta {
      background: var(--paper-alt);
      padding: 8% 9%;
      text-align: center;
      animation-delay: 0.08s;
    }
    .band--meta div { margin: 0.22em 0; }
    .band--meta .models { font-weight: 700; font-size: 0.92em; }
    .band--meta .small { font-size: 0.76em; color: var(--ink-soft); letter-spacing: 0.03em; }

    /* --- tear rules: dotted perforation between bands --- */
    .tear {
      flex: 0 0 auto;
      height: 6px;
      background-image: radial-gradient(circle at 4px 3px, var(--ground) 2.2px, transparent 2.4px);
      background-size: 8px 6px;
      background-position: center;
    }

    /* --- band 3: line items, packed, densest band --- */
    .band--items {
      flex: 1 1 auto;
      padding: 5% 9%;
      animation-delay: 0.16s;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.5em;
    }
    .line {
      display: flex;
      align-items: baseline;
      gap: 3px;
      font-size: 0.86em;
    }
    .line .label { white-space: nowrap; }
    .line .leader {
      flex: 1 1 auto;
      border-bottom: 1px dotted var(--ink-soft);
      height: 0.55em;
      margin: 0 2px;
    }
    .line .price { white-space: nowrap; font-weight: 600; }

    /* --- band 4: total, accent ground, packed + tall --- */
    .band--total {
      background: var(--accent);
      color: var(--accent-ink);
      padding: 9% 9%;
      text-align: center;
      animation-delay: 0.26s, 0s;
      animation-name: settle, glow;
      animation-duration: 0.7s, 3.4s;
      animation-timing-function: ease-out, ease-in-out;
      animation-iteration-count: 1, infinite;
      animation-fill-mode: both, none;
    }
    @keyframes glow {
      0%, 100% { box-shadow: inset 0 0 0 rgba(0,0,0,0); }
      50% { box-shadow: inset 0 0 14px 1px oklch(1 0 0 / 0.28); }
    }
    .band--total .label {
      font-size: 0.78em;
      letter-spacing: 0.16em;
      opacity: 0.85;
    }
    .band--total .price {
      font-size: 1.62em;
      font-weight: 700;
      margin: 0.15em 0;
    }
    .band--total .verdict {
      font-size: 0.74em;
      letter-spacing: 0.03em;
      opacity: 0.9;
    }

    /* --- band 5: footer, breathing, thin --- */
    .band--foot {
      background: var(--paper-alt);
      padding: 6% 9%;
      text-align: center;
      animation-delay: 0.34s;
    }
    .barcode {
      height: 10px;
      margin: 0 auto 0.4em;
      width: 70%;
      background-image: repeating-linear-gradient(
        90deg,
        var(--ink) 0 1px,
        transparent 1px 3px,
        var(--ink) 3px 4px,
        transparent 4px 8px
      );
      opacity: 0.75;
    }
    .band--foot .caption {
      font-size: 0.68em;
      letter-spacing: 0.03em;
      color: var(--ink-soft);
    }
  </style>

  <div class="tile">
    <div class="receipt">
      <div class="band band--head">
        <div class="title">THE CODE REPORT</div>
        <div class="sub">LAUNCH RECEIPT NO. 5.6</div>
      </div>

      <div class="tear"></div>

      <div class="band band--meta">
        <div class="models">GPT-5.6 SOL &middot; FABLE &middot; GROK 4.5</div>
        <div class="small">07/10/26 &nbsp;12:41 &nbsp;REG 02</div>
        <div class="small">CASHIER: THE CODE REPORT</div>
      </div>

      <div class="tear"></div>

      <div class="band band--items">
        <div class="line"><span class="label">SOL CONTEXT</span><span class="leader"></span><span class="price">$0.008/1K</span></div>
        <div class="line"><span class="label">SOL BENCH SCORE</span><span class="leader"></span><span class="price">94.2</span></div>
        <div class="line"><span class="label">FABLE CONTEXT</span><span class="leader"></span><span class="price">$0.012/1K</span></div>
        <div class="line"><span class="label">FABLE BENCH SCORE</span><span class="leader"></span><span class="price">96.7</span></div>
        <div class="line"><span class="label">GROK 4.5 SPEED</span><span class="leader"></span><span class="price">212 tok/s</span></div>
        <div class="line"><span class="label">GROK 4.5 PRICE</span><span class="leader"></span><span class="price">$0.005/1K</span></div>
        <div class="line"><span class="label">LATENCY SURCHG</span><span class="leader"></span><span class="price">$0.002</span></div>
        <div class="line"><span class="label">HYPE TAX</span><span class="leader"></span><span class="price">$0.019</span></div>
      </div>

      <div class="tear"></div>

      <div class="band band--total">
        <div class="label">TOTAL DUE</div>
        <div class="price">$0.046 /1K</div>
        <div class="verdict">VERDICT: FABLE, BY A NOSE</div>
      </div>

      <div class="tear"></div>

      <div class="band band--foot">
        <div class="barcode"></div>
        <div class="caption">THANK YOU FOR WATCHING &mdash; LIKE + SUBSCRIBE</div>
      </div>
    </div>
  </div>
</template>
