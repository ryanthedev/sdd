<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Specimen sheet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f0f0; color: #212121; padding: 1.5rem; }
    .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
             gap: 1.5rem; max-width: 1440px; margin: 0 auto; }
    .specimen { display: flex; flex-direction: column; gap: .375rem; }
    .badge { font-size: .8125rem; font-weight: 600; color: #616161; }
    .control .badge { color: #212121; }
    .control .tile { border: 2px dashed #9e9e9e; }
    .tile { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: #ffffff;
            border: 1px solid #bdbdbd; }
    .badges { display: flex; flex-wrap: wrap; gap: .375rem; }
    .badge-pass, .badge-flag { font-size: .75rem; font-weight: 600; padding: .125rem .5rem;
            border-radius: 999px; line-height: 1.4; }
    .badge-pass { color: #1b5e20; background: #e8f5e9; }
    .badge-flag { color: #b71c1c; background: #ffebee; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
<main class="sheet">
  <figure class="specimen control" data-control="true">

    <div class="tile">
<template shadowrootmode="open">
  <style>
    :host {
      display: block;
      width: 100%;
      height: 100%;
      --bg: oklch(0.19 0.02 280);
      --bg-2: oklch(0.24 0.03 280);
      --accent: oklch(0.62 0.19 290);
      --accent-2: oklch(0.7 0.15 250);
      --text: oklch(0.97 0.005 280);
      --text-dim: oklch(0.72 0.02 280);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-family: var(--font);
    }

    * { box-sizing: border-box; }

    .wrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(120% 100% at 15% 0%, oklch(0.3 0.08 290 / 0.55), transparent 60%),
        radial-gradient(100% 90% at 100% 100%, oklch(0.28 0.09 250 / 0.45), transparent 55%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      padding: 7% 8%;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 8px oklch(0.62 0.19 290 / 0.7);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    .navlinks {
      display: flex;
      gap: 10px;
      font-size: 9px;
      color: var(--text-dim);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      align-self: flex-start;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--accent-2);
      background: oklch(0.62 0.19 290 / 0.14);
      border: 1px solid oklch(0.62 0.19 290 / 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .badge::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-2);
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 27px;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.02em;
      max-width: 90%;
      background: linear-gradient(135deg, var(--text) 40%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.deck {
      margin: 0 0 18px 0;
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--text-dim);
      max-width: 85%;
    }

    .cta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6%;
    }

    .btn-primary {
      font-size: 10.5px;
      font-weight: 700;
      color: oklch(0.15 0.02 280);
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 16px oklch(0.62 0.19 290 / 0.35);
    }

    .btn-secondary {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text);
      background: oklch(1 0 0 / 0.06);
      border: 1px solid oklch(1 0 0 / 0.14);
      padding: 9px 14px;
      border-radius: 8px;
    }

    .stats {
      display: flex;
      gap: 22px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid oklch(1 0 0 / 0.1);
    }

    .stat .num {
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
    }

    .stat .label {
      font-size: 8.5px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 2px;
    }

    .card {
      position: absolute;
      right: 6%;
      top: 22%;
      width: 34%;
      background: oklch(1 0 0 / 0.06);
      border: 1px solid oklch(1 0 0 / 0.12);
      border-radius: 12px;
      padding: 10px;
      backdrop-filter: blur(6px);
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .card .thumb {
      width: 100%;
      height: 44px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      margin-bottom: 8px;
      opacity: 0.85;
    }

    .card .line {
      height: 5px;
      border-radius: 3px;
      background: oklch(1 0 0 / 0.18);
      margin-bottom: 5px;
    }

    .card .line.short { width: 60%; }

    @media (prefers-reduced-motion: reduce) {
      .dot, .card { animation: none; }
    }
  </style>

  <div class="wrap">
    <div class="nav">
      <div class="brand"><span class="dot"></span>TL;DR RECAP</div>
      <div class="navlinks"><span>Episodes</span><span>Archive</span></div>
    </div>

    <span class="badge">New Episode</span>
    <h1>Everything you missed from today's AI model launch</h1>
    <p class="deck">The 22-minute video, distilled into a 90-second read. Benchmarks, pricing, and the one demo everyone's talking about.</p>

    <div class="cta-row">
      <button class="btn-primary">Read the Recap</button>
      <button class="btn-secondary">Watch Video</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="num">4.2M</div><div class="label">Views</div></div>
      <div class="stat"><div class="num">18</div><div class="label">Min Read</div></div>
      <div class="stat"><div class="num">92%</div><div class="label">Liked</div></div>
    </div>

    <div class="card">
      <div class="thumb"></div>
      <div class="line"></div>
      <div class="line short"></div>
    </div>
  </div>
</template>
    </div>

<template shadowrootmode="open">
  <style>
    :host {
      display: block;
      width: 100%;
      height: 100%;
      --hue: 35;
      --ground: oklch(0.94 0.025 35);
      --ground-line: oklch(0.88 0.03 35);
      --paper: oklch(0.97 0.012 35);
      --paper-alt: oklch(0.93 0.02 35);
      --ink: oklch(0.27 0.025 35);
      --ink-soft: oklch(0.48 0.02 35);
      --band-dark: oklch(0.24 0.032 35);

      color: var(--ink);
      overflow: hidden;
      position: relative;
    }

    * { box-sizing: border-box; }

    .tile {
      width: 100%;
      height: 100%;
      background: var(--ground);
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 5% 0;
      position: relative;
      overflow: hidden;

    /* laminate diner-counter texture on the outer ground */
    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        118deg,
        oklch(1 0 0 / 0.06) 0 2px,
        transparent 2px 14px
      );
      pointer-events: none;
    }

    .receipt {
      position: relative;
      width: 54%;
      min-width: 150px;
      max-width: 230px;
      background: var(--paper);
      display: flex;
      flex-direction: column;
      box-shadow: 0 3px 0 var(--ground-line), 0 10px 22px oklch(0.2 0.02 35 / 0.28);
      overflow: hidden;
      font-size: 7.4px;
      line-height: 1.35;
    }

    /* lamination sheen — the detail-move, quiet and small */
    .receipt::after {
      content: "";
      position: absolute;
      inset: -20% -50%;
      background: linear-gradient(
        112deg,
        transparent 42%,
        oklch(1 0 0 / 0.22) 47%,
        oklch(1 0 0 / 0.45) 50%,
        oklch(1 0 0 / 0.22) 53%,
        transparent 58%
      );
      mix-blend-mode: overlay;
      animation: sheen-drift 8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes sheen-drift {
      0%, 100% { transform: translate(-12%, -8%); }
      50% { transform: translate(12%, 8%); }
    }

    .band {
      flex: 0 0 auto;
      position: relative;
      padding: 6% 9%;
      background: var(--paper);
      color: var(--ink);
      opacity: 1;
      transform: translateY(0);
      animation: settle 0.7s ease-out both;
    }

    @keyframes settle {
      0% { opacity: 0.55; transform: translateY(-4%); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* --- band 1: header, dark ground, packed --- */
    .band--head {
      background: var(--band-dark);
      color: var(--band-dark-ink);
      padding: 7% 9% 6%;
      text-align: center;
      animation-delay: 0s;
    }
    .band--head .title {
      font-weight: 700;
      letter-spacing: 0.14em;
      font-size: 1.28em;
    }
    .band--head .sub {
      margin-top: 0.4em;
      font-size: 0.78em;
      letter-spacing: 0.08em;
      opacity: 0.75;
    }

    /* --- band 2: meta, light, breathing --- */
    .band--meta {
      background: var(--paper-alt);
      padding: 8% 9%;
      text-align: center;
      animation-delay: 0.08s;
    }
    .band--meta div { margin: 0.22em 0; }
    .band--meta .models { font-weight: 700; font-size: 0.92em; }
    .band--meta .small { font-size: 0.76em; color: var(--ink-soft); letter-spacing: 0.03em; }

    /* --- tear rules: dotted perforation between bands --- */
    .tear {
      flex: 0 0 auto;
      height: 6px;
      background-image: radial-gradient(circle at 4px 3px, var(--ground) 2.2px, transparent 2.4px);
      background-size: 8px 6px;
      background-position: center;
    }

    /* --- band 3: line items, packed, densest band --- */
    .band--items {
      flex: 1 1 auto;
      padding: 5% 9%;
      animation-delay: 0.16s;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.5em;
    }
    .line {
      display: flex;
      align-items: baseline;
      gap: 3px;
      font-size: 0.86em;
    }
    .line .label { white-space: nowrap; }
    .line .leader {
      flex: 1 1 auto;
      border-bottom: 1px dotted var(--ink-soft);
      height: 0.55em;
      margin: 0 2px;
    }
    .line .price { white-space: nowrap; font-weight: 600; }

    /* --- band 4: total, accent ground, packed + tall --- */
    .band--total {
      background: var(--accent);
      color: var(--accent-ink);
      padding: 9% 9%;
      text-align: center;
      animation-delay: 0.26s, 0s;
      animation-name: settle, glow;
      animation-duration: 0.7s, 3.4s;
      animation-timing-function: ease-out, ease-in-out;
      animation-iteration-count: 1, infinite;
      animation-fill-mode: both, none;
    }
    @keyframes glow {
      0%, 100% { box-shadow: inset 0 0 0 rgba(0,0,0,0); }
      50% { box-shadow: inset 0 0 14px 1px oklch(1 0 0 / 0.28); }
    }
    .band--total .label {
      font-size: 0.78em;
      letter-spacing: 0.16em;
      opacity: 0.85;
    }
    .band--total .price {
      font-size: 1.62em;
      font-weight: 700;
      margin: 0.15em 0;
    }
    .band--total .verdict {
      font-size: 0.74em;
      letter-spacing: 0.03em;
      opacity: 0.9;
    }

    /* --- band 5: footer, breathing, thin --- */
    .band--foot {
      background: var(--paper-alt);
      padding: 6% 9%;
      text-align: center;
      animation-delay: 0.34s;
    }
    .barcode {
      height: 10px;
      margin: 0 auto 0.4em;
      width: 70%;
      background-image: repeating-linear-gradient(
        90deg,
        var(--ink) 0 1px,
        transparent 1px 3px,
        var(--ink) 3px 4px,
        transparent 4px 8px
      );
      opacity: 0.75;
    }
    .band--foot .caption {
      font-size: 0.68em;
      letter-spacing: 0.03em;
      color: var(--ink-soft);
    }
  </style>

  </div>
</template>

<template shadowrootmode="open">
  <style>
    :host {
      display: block;
      width: 100%;
      height: 100%;
      --hue: 220;
      --accent: oklch(0.55 0.16 220);
      --accent-soft: oklch(0.68 0.14 220);
      --ground: oklch(0.97 0.014 220);
      --ground-panel: oklch(0.995 0.006 220);
      --ink: oklch(0.24 0.045 250);
      --ink-soft: oklch(0.46 0.03 245);
      --font: "Comic Sans MS", "Chalkboard SE", "Comic Neue", "Marker Felt", sans-serif;
      --font-body: system-ui, "Segoe UI", sans-serif;
      font-family: var(--font);
      background: var(--ground);
      overflow: hidden;
      position: relative;
      box-sizing: border-box;
      color: var(--ink);
    }
    * { box-sizing: border-box; }

    /* faint multicolumn page guides — the ground the display type violates */
    .page {
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        90deg,
        oklch(0.55 0.16 220 / 0.05) 0,
        oklch(0.55 0.16 220 / 0.05) 1px,
        transparent 1px,
        transparent 24.9%
      );
      padding: 9px;
    }

    /* ---------- eyebrow + masthead: oversized display type, crosses the grid ---------- */
    .eyebrow {
      position: absolute;
      top: 8px;
      left: 10px;
      z-index: 6;
      font-family: var(--font-body);
      font-size: 7.5px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--accent);
      background: var(--ground-panel);
      padding: 2px 5px;
      border: 1.5px solid var(--ink);
      transform: rotate(-2deg);
    }

    .masthead {
      position: absolute;
      top: 13px;
      left: 6px;
      z-index: 6;
      width: 62%;
      margin: 0;
      font-family: var(--font);
      font-weight: 700;
      font-size: 37px;
      line-height: 0.82;
      letter-spacing: -0.5px;
      color: var(--ink);
      text-shadow: 2px 2px 0 var(--accent-soft), 4px 4px 0 oklch(0.55 0.16 220 / 0.35);
      transform: rotate(-1.6deg);
      transform-origin: left top;
      animation: wobble 5s ease-in-out infinite;
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(-1.6deg) translateY(0); }
      50% { transform: rotate(-0.6deg) translateY(-1px); }
    }

    .deck {
      position: absolute;
      top: 58px;
      right: 8px;
      z-index: 6;
      width: 34%;
      font-family: var(--font-body);
      font-size: 7px;
      line-height: 1.4;
      color: var(--ink-soft);
      column-count: 1;
      background: oklch(1 0 0 / 0.7);
      padding: 3px 4px;
      border-left: 2px solid var(--accent);
    }

    /* ---------- comic panel grid, gutters like a page, hard borders ---------- */
    .panels {
      position: absolute;
      top: 57px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr;
      grid-template-rows: 1.15fr 1fr;

        "a a b"
        "c d b";
      gap: 6px;
    }
    .panel {
      position: relative;
      border: 3px solid var(--ink);
      background: var(--ground-panel);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 2px 0 oklch(0.24 0.045 250 / 0.18);
    }
    .panel.a { grid-area: a; }
    .panel.b { grid-area: b; }
    .panel.c { grid-area: c; }
    .panel.d { grid-area: d; }

    .art {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(155deg, oklch(0.9 0.03 220), oklch(0.82 0.05 220));

      font-family: var(--font-body);
      font-size: 6.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--ink);
      background: oklch(1 0 0 / 0.75);
      border: 1px solid var(--ink);
      padding: 1.5px 4px;

        radial-gradient(circle, var(--accent) 1.1px, transparent 1.3px) 3.5px 3.5px/7px 7px,
        oklch(0.9 0.02 220);

    }
    @keyframes shimmer {
      0%, 100% { background-position: 0 0, 3.5px 3.5px, 0 0; }
      50% { background-position: 1.5px 1px, 5px 4.5px, 0 0; }
    }

    .caption {
      flex: 0 0 auto;
      font-family: var(--font-body);
      font-size: 6.6px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--ground);
      background: var(--ink);
      padding: 3px 5px;
      border-top: 2px solid var(--ink);
    }

    .burst {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-soft);
      border: 1.5px solid var(--ink);
